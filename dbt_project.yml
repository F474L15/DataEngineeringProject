
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'DataEngineeringProject'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  DataEngineeringProject:
    staging:
      +database: "{{ env_var('DBT_SILVERPROJECT_DB') }}"
      +schema: staging
      +materialized: view

    silver:
      +database: "{{ env_var('DBT_SILVERPROJECT_DB') }}"
      +schema: silver
      +materialized: table
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +tags: ['silver']

    gold:
      +database: "{{ env_var('DBT_GOLDPROJECT_DB') }}"
      +schema: gold
      +materialized: table
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +tags: ['gold']

# Parámetros de la carga incremental (ver macros/incremental.sql y
# macros/palabras_clave.sql). Se pueden cambiar por ejecución con --vars.
vars:
  incremental_margen_minutos: 30      # margen que se resta a la última marca de carga
  merge_ventana_dias: 36500           # días de la tabla destino que compara el merge. Alto = una ejecución repetida no duplica
                                      # (el filtro relee el último lote). Bajar a 3 solo con cargas nuevas y frecuentes.
  ventana_dias_antes_evento: 7        # un texto puede ser hasta 7 días anterior al evento
  ventana_dias_despues_evento: 90     # y hasta 90 días posterior
  buscar_eventos_nuevos: false        # true en el job diario: eventos nuevos contra el histórico
  eventos_nuevos_horas: 26            # eventos cargados en las últimas horas, en ese job
  historico_dias_eventos_nuevos: 365  # tope de histórico que lee ese job

# Seeds: dimensiones pequeñas y estáticas (tablones y categorías). Van a su propio
# schema, dentro de la database Silver. Tipos explícitos para que dbt no los
# infiera del CSV.

seeds:
  DataEngineeringProject:
    +database: "{{ env_var('DBT_SILVERPROJECT_DB') }}"
    +schema: seeds
    tablones:
      +column_types:
        id_tablon: number(38, 0)
        name_tablon: varchar(100)
        siglas: varchar(10)
    categorias:
      +column_types:
        id_categoria: number(38, 0)
        categoria: varchar(50)
        categoria_clave: varchar(50)