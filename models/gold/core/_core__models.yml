version: 2

models:
  - name: dim_fecha
    columns:
      - name: id_fecha
        tests: [unique, not_null]
  - name: dim_categoria
    columns:
      - name: id_categoria
        tests: [unique, not_null]
  - name: dim_evento
    columns:
      - name: id_evento
        tests: [unique, not_null]
      - name: id_categoria
        tests:
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: id_categoria
  - name: dim_noticia
    columns:
      - name: id_noticia
        tests: [unique, not_null]
      - name: id_categoria
        tests:
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: id_categoria
  - name: dim_thread
    columns:
      - name: id_thread
        tests: [unique, not_null]
  - name: dim_post
    columns:
      - name: id_post
        tests: [unique, not_null]
      - name: id_thread
        tests:
          - relationships:
              arguments:
                to: ref('dim_thread')
                field: id_thread

  - name: fct_menciona_evento_noticia
    description: Evento x noticia x palabra clave. Vacío hasta definir la coincidencia en staging.
    columns:
      - name: id_men
        tests: [unique, not_null]
      - name: id_evento
        tests:
          - relationships:
              arguments:
                to: ref('dim_evento')
                field: id_evento
      - name: id_noticia
        tests:
          - relationships:
              arguments:
                to: ref('dim_noticia')
                field: id_noticia
      - name: id_fecha
        tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: id_fecha
              config:
                severity: warn

  - name: fct_menciona_evento_4chan
    description: Evento x thread x palabra clave. Fecha = primer post que menciona. Vacío hasta definir la coincidencia.
    columns:
      - name: id_met
        tests: [unique, not_null]
      - name: id_evento
        tests:
          - relationships:
              arguments:
                to: ref('dim_evento')
                field: id_evento
      - name: id_thread
        tests:
          - relationships:
              arguments:
                to: ref('dim_thread')
                field: id_thread
      - name: id_fecha
        tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: id_fecha
              config:
                severity: warn